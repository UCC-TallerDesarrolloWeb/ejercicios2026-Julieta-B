<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form action="#" method="post">
        <p>
            Nombre:<br>
            <input type="text" name="nombre" size="40" maxlength="40" placeholder="Ingrese su nombre">
        </p>

        <p>
            Apellido:<br>
            <input type="text" name="apellido" size="40" maxlength="40" placeholder="Ingrese su apellido">
        </p>

        <p>
            Sexo:<br>
            <input type="radio" name="sexo" value="masculino"> Masculino
            <input type="radio" name="sexo" value="femenino"> Femenino
        </p>

        <p>
            Edad:<br>
            <input type="number" name="edad" min="1" max="120" maxlength="3" placeholder="Ej: 20">
        </p>

        <p>
            Email:<br>
            <input type="email" name="email" size="40" maxlength="50" placeholder="correo@ejemplo.com">
        </p>

        <p>
            Usuario:<br>
            <input type="text" name="usuario" size="40" maxlength="20" placeholder="Elija un usuario">
        </p>

        <p>
            Password:<br>
            <input type="password" name="password" size="40" maxlength="20" placeholder="Contraseña">
        </p>

        <p>
            Confirmar Password:<br>
            <input type="password" name="confirmar_password" size="40" maxlength="20" placeholder="Repita la contraseña">
        </p>

        <p>
            Tipo de servicio:<br>
            <select name="servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
        </p>

        <p>
            Tema de interés:<br>
            <input type="checkbox" name="tema_politica" value="politica"> Política<br>
            <input type="checkbox" name="tema_negocios" value="negocios"> Negocios<br>
            <input type="checkbox" name="tema_tecnologia" value="tecnologia"> Tecnología<br>
            <input type="checkbox" name="tema_salud" value="salud"> Salud
        </p>

        <p>
            Agregue un comentario:<br>
            <textarea name="comentario" rows="4" cols="40" placeholder="Escriba su comentario aquí..."></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>

</body>
</html>
