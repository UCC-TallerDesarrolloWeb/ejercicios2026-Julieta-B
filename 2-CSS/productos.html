<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos - CSS Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        main {
            display: grid;
            /* 3 columnas del mismo tamaño (1 fracción cada una) */
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 20px; /* Espacio entre las tarjetas */
            max-width: 900px;
            margin: 0 auto;
        }

        /* Estilo de las tarjetas, hijos del grid */
        .tarjeta {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
        }

        .tarjeta img {
            width: 100%;
            border-radius: 5px;
        }

        .tarjeta h3 {
            color: #0b5394;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Nuestro Catálogo</h1>

    <!-- Contenedor Grid -->
    <main>
        <div class="tarjeta">
            <img src="https://picsum.photos/300/200?random=1" alt="Producto 1">
            <h3>Producto 1</h3>
        </div>
        
        <div class="tarjeta">
            <img src="https://picsum.photos/300/200?random=2" alt="Producto 2">
            <h3>Producto 2</h3>
        </div>
        
        <div class="tarjeta">
            <img src="https://picsum.photos/300/200?random=3" alt="Producto 3">
            <h3>Producto 3</h3>
        </div>
    </main>

</body>
</html>
