<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Backgrounds</title>
    <style>
        body {
            background-color: #5c94fc; 
            
            background-image: url('imagenes/fondo_mario.jpg'); 
            
            background-repeat: no-repeat;  
            
            background-position: center bottom; /* Centra la imagen horizontalmente y la alinea abajo */
            
            background-size: cover; /* para que cubra toda la pantalla sin deformarse */
            
            background-attachment: fixed; /* Fija el fondo para que no se desplace con scroll */
            
            height: 100vh;
            margin: 0;
        }
        
        h1 {
            text-align: center;
            color: white;
            text-shadow: 3px 3px 0 #000; 
            padding-top: 50px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Nivel 1 - Backgrounds CSS</h1>
</body>
</html>
