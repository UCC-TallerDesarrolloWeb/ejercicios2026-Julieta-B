<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    
    <style>
        /* Las imágenes deben ocupar el 100% de su columna */
        .galeria img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contenedor principal Grid */
        .galeria {
            display: grid;
            gap: 5px; /* Espacio mínimo típico del feed de Instagram */
            max-width: 935px; /* Ancho estándar de Instagram en web */
            margin: 0 auto;
        }

        /* Se debe mostrar 1 columna si la pantalla tiene como máximo 600px */
        @media (max-width: 600px) {
            .galeria {
                grid-template-columns: 1fr;
            }
        }

        /* Se deben mostrar 3 columnas si la pantalla tiene un mínimo de 601px */
        @media (min-width: 601px) {
            .galeria {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

<!-- Único contenedor principal para todas las fotos -->
<div class="galeria">
    <div><img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_01.png"></div>

    <div><img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_07.png"></div>

</html>
