<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - CSS Grid</title>
    <style>
       main{
            display: grid;
            grid-template-columns: auto auto auto;
        }
        main div{
            border: 1px solid black;
            margin: 10px;
            text-align: center;
            border-radius: 15px;
            padding: 10px;
        }
        img{
            
            width:100%;
        }

        .item1{
            grid-area: header;
        }
        .item2{
            grid-area: nav;
            margin: 0px auto;
        }
        .item3{
            grid-area: aside;
            
        }
        .item4{
            grid-area: main;
        }
        .item5{
            grid-area: footer;
        }

        .grid-cont{
            display:grid;
            grid-template-areas: 
                "header header header header"
                "nav nav nav nav"
                "aside main main main"
                "footer footer footer footer";
        }

        a{
            text-decoration: none;
            background-color: brown;
            color: white;
            font-weight: 500;
            padding: 5px;
            transition: backgroud-color 0.8s linear 0.2s;
        }
        a:hover{
            background-color: darkblue;
            padding: 7px;
        }
        footer{
            text-align: center;
        }
    </style>
    <script  src="tienda.js"></script>
</head>

<body class="grid-cont" onload="cargarProductos()">
    <header class="item1">
        <h1>Productos</h1>
    </header>
    <nav class="item2">
        <a href="productos.html">Catálogo de productos</a>
        <a href="carrito.html">Carrito de compras</a>
    </nav>
    <aside class="item3">
        <form name="filter">
            <fieldset>
                <legend>Búsqueda</legend>
                <label for="search">Buscar: </label>
                <input type="text" id="search" name="search" >
            </fieldset>
            <fieldset>
                <legend>Precios</legend>
                <p>
                    <label for="min">Mínimo</label>
                    <input type="number" id="min" name="min" min="0">
                </p>
                <p>
                    <label for="max">Mínimo</label>
                    <input type="number" id="max" name="max" min="0">
                </p>
            </fieldset>
            <fieldset>
                <legend>Tipo de productos</legend>
                <p>
                    <input type="checkbox" id="prot" name="prot" value="prot">
                    <label for="prot">Productos</label>
                </p>
                <p>
                    <input type="checkbox" id="ent" name="ent" value="ent">
                    <label for="ent">Entrenamiento</label>
                </p>
            </fieldset>
        </form>
    </aside>
    <dialog id="modal">
        <h2>Detalle producto</h2>
        <h3 id="tit-prod">Producto 1</h3>
        <p id="desc-prod">descripcion producto</p>

        <button type="button" onclick="cerrarModal()">
            Cerrar
        </button>
    </dialog>
    <main class="item4" id="mostrarCatalogo">
        
    </main>
    <footer class="item5">
        info contacto
    </footer>
</body>
</html>
